# Override de produção do Ciliar, copiado do Opex.
#
# Aplicado junto do `docker-compose.yml` pelo pipeline de deploy (`-f docker-compose.yml
# -f docker-compose.deploy.yml`). Ele fixa a imagem já construída no GitHub Actions e
# impede build/pull no servidor de produção.
#
# A imagem é informada por `CILIAR_IMAGE` (repositório:tag) e o serviço é recriado com
# `docker compose up -d --no-build --pull never app`, reutilizando portas, redes, limites
# e o `.env` do `docker-compose.yml` sem alterações.
services:
  app:
    image: ${CILIAR_IMAGE:?defina CILIAR_IMAGE (repositório:tag)}
    pull_policy: never
